[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "A research assistant powered by Google NotebookLM via notebooklm-py"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "rachidcury"},
]
dependencies = [
    "notebooklm-py>=0.3.0",
]

[project.optional-dependencies]
browser = [
    "notebooklm-py[browser]>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
